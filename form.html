  <div class="container">
 <h3>Formulir Pendaftaran</h3>
 <form>
  Nama Lengkap:<br>
  <input type="text" placeholder="Masukkan nama"><br><br>
  
  Email:<br>
  <input type="email" placeholder="nama@email.com"><br><br>
  
  Password:<br>
  <input type="password"><br><br>
  
  Umur:<br>
  <input type="number" style="width:50px;"><br><br>
  
  Tanggal Lahir:<br>
  <input type="date"><br><br>
  
  Jenis Kelamin:<br>
  <input type="radio" name="jk"> Laki-laki<br>
  <input type="radio" name="jk"> Perempuan<br><br>
  
  Hobi:<br>
  <input type="checkbox"> Coding<br>
  <input type="checkbox"> Gaming<br>
  <input type="checkbox"> Olahraga<br><br>
  
  Jurusan:<br>
  <select>
   <option>-- Pilih Jurusan --</option>
   <option>Teknik Informatika</option>
   <option>Sistem Informasi</option>
   <option>DKV</option>
  </select><br><br>
  
  Alamat:<br>
  <textarea placeholder="Masukkan alamat" rows="4" cols="35"></textarea><br><br>
  
  Foto:<br>
  <input type="file"><br><br>
  
  Website:<br>
  <input type="url" placeholder="https://example.com"><br><br>
  
  <button type="submit">Kirim</button>
  <button type="reset">Reset</button>
 </form>
</div>
</body>
